[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-gibson"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML==6.0.3"]

[tool.setuptools.packages.find]
include = ["adapters*", "evaluation*", "experiment*", "gibson_env*", "telemetry*"]
