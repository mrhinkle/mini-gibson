# Mini-Gibson OpenHands SFT: pinned Nemotron 3.5 Lightning BF16 LoRA.
# One approximately one-epoch run: 94 optimizer steps x global batch 2.

recipe: TrainFinetuneRecipeForNextTokenPrediction

step_scheduler:
  global_batch_size: 2
  local_batch_size: 1
  ckpt_every_steps: 25
  val_every_steps: 25
  max_steps: 94

dist_env:
  backend: nccl
  timeout_minutes: 15

rng:
  _target_: nemo_automodel.components.training.rng.StatefulRNG
  seed: 414
  ranked: true

model:
  _target_: nemo_automodel.NeMoAutoModelForCausalLM.from_pretrained
  pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
  revision: a9904d24bcc1d289a1950fa9d2b978c47cf903b9
  num_nextn_predict_layers: 2
  mtp_use_repeated_layer: true
  mtp_loss_scaling_factor: 0.1
  backend:
    _target_: nemo_automodel.components.models.common.BackendConfig
    attn: te
    linear: torch
    rms_norm: torch_fp32
    experts: torch_mm
    dispatcher: torch

compile:
  enabled: false

checkpoint:
  enabled: true
  checkpoint_dir: /workspace/output-lightning/checkpoints
  model_save_format: safetensors
  save_consolidated: final

peft:
  _target_: nemo_automodel.components._peft.lora.PeftConfig
  exclude_modules: ["*.out_proj"]
  dim: 8
  alpha: 32
  use_triton: true
  use_memory_efficient_lora: true

distributed:
  strategy: fsdp2
  dp_size: none
  tp_size: 1
  cp_size: 1
  ep_size: 2
  sequence_parallel: false
  activation_checkpointing: true

loss_fn:
  _target_: nemo_automodel.components.loss.masked_ce.MaskedCrossEntropy

dataset:
  _target_: nemo_automodel.components.datasets.llm.agent_chat.make_agent_chat_dataset
  path: /workspace/data-v7-final/train.jsonl
  seq_length: 4096
  truncation: true
  truncate_history: true
  tokenizer:
    pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
    revision: a9904d24bcc1d289a1950fa9d2b978c47cf903b9

packed_sequence:
  packed_sequence_size: 0

dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: true
  num_workers: 0

validation_dataset:
  _target_: nemo_automodel.components.datasets.llm.agent_chat.make_agent_chat_dataset
  path: /workspace/data-v7-final/dev.jsonl
  seq_length: 4096
  truncation: true
  truncate_history: true
  tokenizer:
    pretrained_model_name_or_path: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
    revision: a9904d24bcc1d289a1950fa9d2b978c47cf903b9

validation_dataloader:
  _target_: torchdata.stateful_dataloader.StatefulDataLoader
  collate_fn: nemo_automodel.components.datasets.utils.default_collater
  shuffle: false
  num_workers: 0

optimizer:
  _target_: torch.optim.AdamW
  betas: [0.9, 0.95]
  eps: 1.0e-8
  lr: 1.0e-4
  weight_decay: 0.1

lr_scheduler:
  lr_decay_style: cosine
  lr_warmup_steps: 2
  min_lr: 1.0e-5

nvtx: false
