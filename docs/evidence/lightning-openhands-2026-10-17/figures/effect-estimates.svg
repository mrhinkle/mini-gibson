<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Paired issue-resolution differences for the two stages and all 48 tasks</title>
  <desc id="desc">Stage 1 difference 25 points with a 90 percent interval from 4.17 to 45.83. Stage 2 difference 4.17 points with interval from minus 12.5 to 20.83. All 48 difference 14.58 points with interval from zero to 29.17.</desc>
  <rect width="900" height="330" fill="#ffffff"/>
  <style>
    .label { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1f2933; }
    .detail { font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #52606d; }
    .axis { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #7b8794; }
  </style>
  <text x="24" y="28" class="label" font-weight="600">Paired resolution difference</text>
  <text x="24" y="49" class="detail">percentage points; dots are observed effects, lines are paired 90% intervals</text>

  <line x1="170" y1="264" x2="690" y2="264" stroke="#cbd2d9" stroke-width="1"/>
  <line x1="290" y1="65" x2="290" y2="264" stroke="#9aa5b1" stroke-width="1"/>
  <text x="290" y="285" class="axis" text-anchor="middle">0</text>
  <text x="210" y="285" class="axis" text-anchor="middle">−10</text>
  <text x="370" y="285" class="axis" text-anchor="middle">10</text>
  <text x="450" y="285" class="axis" text-anchor="middle">20</text>
  <text x="530" y="285" class="axis" text-anchor="middle">30</text>
  <text x="610" y="285" class="axis" text-anchor="middle">40</text>
  <text x="690" y="285" class="axis" text-anchor="middle">50</text>
  <text x="690" y="308" class="axis" text-anchor="end">adapter advantage →</text>

  <text x="24" y="101" class="label">Stage 1 · first 24</text>
  <text x="24" y="121" class="detail">6/24 → 12/24 · W/L 8/2</text>
  <line x1="323" y1="105" x2="657" y2="105" stroke="#8391a2" stroke-width="3" stroke-linecap="round"/>
  <circle cx="490" cy="105" r="6" fill="#52687a"/>
  <text x="718" y="110" class="detail">+25.00 [4.17, 45.83]</text>

  <text x="24" y="171" class="label">Stage 2 · fresh 24</text>
  <text x="24" y="191" class="detail">3/24 → 4/24 · W/L 4/3</text>
  <line x1="190" y1="175" x2="457" y2="175" stroke="#8391a2" stroke-width="3" stroke-linecap="round"/>
  <circle cx="323" cy="175" r="6" fill="#52687a"/>
  <text x="718" y="180" class="detail">+4.17 [−12.50, 20.83]</text>

  <text x="24" y="241" class="label" font-weight="600">All 48 development</text>
  <text x="24" y="261" class="detail">9/48 → 16/48 · W/L 12/5</text>
  <line x1="290" y1="245" x2="523" y2="245" stroke="#143f6b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="407" cy="245" r="7" fill="#143f6b"/>
  <text x="718" y="250" class="label" font-weight="600">+14.58 [0.00, 29.17]</text>
</svg>
