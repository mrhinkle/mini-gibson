apiVersion: gibson.ai/v1alpha1
kind: Experiment

metadata:
  name: mini-gibson-hackathon
  version: DRAFT

model:
  id: nemotron-base
  provider: vllm
  artifact: nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-BF16
  revision: UNPINNED

agent:
  id: hermes
  adapter: UNFROZEN

environment:
  id: gibson-coding-v0.1
  completion_authority: gibson
  max_repairs: 3

decision_services:
  jev:
    enabled: false
    provider: typesafe
    model: jev-latest
    endpoint_env: MINI_GIBSON_JEV_ENDPOINT
    api_key_env: TYPESAFE_API_KEY
    min_confidence: 0.80
    causal_policy: outside_scored_loop
    roles:
      - supervisor_escalation
      - tool_risk
      - benchmark_anomaly_triage

benchmark:
  manifest: bench/manifest.v0.1.json
  status: DRAFT_DO_NOT_TUNE

run:
  trials_per_task: UNFROZEN
  max_steps: UNFROZEN
  wall_clock_seconds: UNFROZEN

evaluation:
  primary_metric: verified_task_resolution_rate

reproducibility:
  require_git_sha: true
  require_model_revision: true
  require_benchmark_hash: true

# Jev cannot award VERIFIED or become a hidden treatment variable.
# Freeze only after Kimi K3 / GLM-5.2 / Claude design review.
